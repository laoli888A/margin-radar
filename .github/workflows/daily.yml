name: Daily Margin Radar

on:
  schedule:
    # 1. 下午 16:30 (UTC 08:30) 自动运行：看当天 ETF 底牌和行业资金（最重要）
    - cron: '30 8 * * 1-5'
    # 2. 晚上 22:30 (UTC 14:30) 自动运行：两融结算数据更新，看最终全量版
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # 允许手动点击测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python monitor.py
